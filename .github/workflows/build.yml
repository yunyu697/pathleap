name: build

# tag v* 触发完整发布链路：校验 → 编译 → 打包 zip + 安装包 → 创建/更新 Release 并上传资产。
# main / PR 只做校验与编译，不打包、不发布。
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 解析版本号
        id: lpver
        shell: pwsh
        run: |
          $LpRefType = "${{ github.ref_type }}"
          $LpRefName = "${{ github.ref_name }}"
          if ($LpRefType -eq 'tag') {
            if (-not $LpRefName.StartsWith('v')) {
              throw "tag 必须以 v 开头: $LpRefName"
            }
            $LpVersion = $LpRefName.Substring(1)
          }
          else {
            $LpPropsRaw = Get-Content -LiteralPath ./Directory.Build.props -Raw
            $LpVersion = [regex]::Match($LpPropsRaw, '<PathleapVersion>([^<]+)</PathleapVersion>').Groups[1].Value.Trim()
          }

          if ($LpVersion -notmatch '^[0-9]+[.][0-9]+[.][0-9]+(-alpha[0-9]+)?$') {
            throw "版本号不合法: $LpVersion"
          }

          # alpha 版本走预览通道：清单标记 preview，Release 标记为预发布，不进 /releases/latest。
          $LpChannel = if ($LpVersion -match '-alpha[0-9]+$') { 'preview' } else { 'stable' }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$LpVersion"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "channel=$LpChannel"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "artifactName=Pathleap-$LpVersion-win-x64"

      - name: 脚本变量命名检查
        shell: pwsh
        run: ./tools/Test-LpVariableNames.ps1

      - name: 发布工具自检（Ed25519 / 语义化版本 / 清单签名）
        shell: pwsh
        run: dotnet run --project src/Pathleap.ReleaseTool -- selftest

      - name: 编译 Release x64（UI / Service / Shared）
        shell: pwsh
        run: ./tools/Build-Lp.ps1 -LpConfiguration Release -LpSkipVariableCheck -LpVersion '${{ steps.lpver.outputs.version }}'

      - name: 打包便携版 zip（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/Package-Lp.ps1 -LpConfiguration Release

      - name: 安装 Inno Setup（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 生成安装包（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/Package-LpInstaller.ps1 -LpConfiguration Release

      - name: 核对产物与完整性（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $LpVersion = '${{ steps.lpver.outputs.version }}'
          $LpZipPath = "dist/Pathleap-$LpVersion-win-x64.zip"
          $LpSetupPath = "dist/Pathleap-$LpVersion-win-x64-setup.exe"
          $LpExpectBootstrap = 'runtimes/win-x64/native/Microsoft.WindowsAppRuntime.Bootstrap.dll'

          Get-ChildItem -Path dist -File | Select-Object Name, Length | Format-Table -AutoSize

          if (-not (Test-Path -LiteralPath $LpZipPath)) { throw "缺少便携包: $LpZipPath" }
          if (-not (Test-Path -LiteralPath $LpSetupPath)) { throw "缺少安装包: $LpSetupPath" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $LpArchive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $LpZipPath).Path)
          try {
            $LpEntries = $LpArchive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }
            if (-not ($LpEntries -contains $LpExpectBootstrap)) {
              throw "便携包缺少 $LpExpectBootstrap：上次遗漏过该运行时，拒绝发布"
            }
          }
          finally {
            $LpArchive.Dispose()
          }

          Write-Host "产物完整性核对通过：$LpZipPath 含 $LpExpectBootstrap；安装包 $LpSetupPath 存在"

      - name: 上传构建产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lpver.outputs.artifactName }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: 发布 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LP_SIGNING_KEY: ${{ secrets.PATHLEAP_SIGNING_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $LpTag = "${{ github.ref_name }}"
          $LpVersion = "${{ steps.lpver.outputs.version }}"
          $LpChannel = "${{ steps.lpver.outputs.channel }}"
          $LpIsPreview = $LpChannel -eq 'preview'
          $LpNotesFile = "docs/$LpVersion-发布说明.md"
          $LpZipPath = "dist/Pathleap-$LpVersion-win-x64.zip"
          $LpSetupPath = "dist/Pathleap-$LpVersion-win-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $LpZipPath)) { throw "缺少便携包: $LpZipPath" }
          if (-not (Test-Path -LiteralPath $LpSetupPath)) { throw "缺少安装包: $LpSetupPath" }
          $LpAssets = @($LpZipPath, $LpSetupPath)

          if (gh release view $LpTag 2>$null) {
            gh release upload $LpTag @LpAssets --clobber
            if ($LASTEXITCODE -ne 0) { throw '上传资产到 Release 失败' }
            if ($LpIsPreview) {
              gh release edit $LpTag --prerelease
              if ($LASTEXITCODE -ne 0) { throw '标记预发布失败' }
            }
            if (Test-Path -LiteralPath $LpNotesFile) {
              gh release edit $LpTag --notes-file $LpNotesFile
            }
          }
          else {
            # 预发布只影响 Release 标记与清单 channel；参数按需拼装，避免空数组 splat 被当成参数。
            $LpCreateArgs = @($LpTag) + $LpAssets + @('--title', "Pathleap $LpVersion")
            if ($LpIsPreview) { $LpCreateArgs += '--prerelease' }
            if (Test-Path -LiteralPath $LpNotesFile) {
              $LpCreateArgs += @('--notes-file', $LpNotesFile)
            }
            else {
              $LpCreateArgs += '--generate-notes'
            }
            gh release create @LpCreateArgs
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败' }
          }

          # 清单签名：私钥只来自 secret；seed 公钥必须与客户端内置公钥一致，否则直接失败。
          if ([string]::IsNullOrWhiteSpace($env:LP_SIGNING_KEY)) {
            Write-Warning "未配置 PATHLEAP_SIGNING_KEY，本次未生成清单（不生成、也不上传未签名的 latest.json）。"
            Write-Host "::warning title=本次未生成清单::缺少 PATHLEAP_SIGNING_KEY；zip/setup 已上传，latest.json 与 latest.json.sig 未生成。"
            exit 0
          }

          $LpKeyFile = Join-Path $env:RUNNER_TEMP 'lp-signing-seed.b64'
          Set-Content -LiteralPath $LpKeyFile -Value $env:LP_SIGNING_KEY.Trim() -NoNewline -Encoding ascii

          dotnet run --project src/Pathleap.ReleaseTool -- create `
            --version $LpVersion --tag $LpTag --channel $LpChannel `
            --notes-file $LpNotesFile `
            --installer $LpSetupPath --portable $LpZipPath `
            --out dist/latest.json --sig-out dist/latest.json.sig `
            --released-at ((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')) `
            --seed-file $LpKeyFile
          if ($LASTEXITCODE -ne 0) { throw '生成并签名 latest.json 失败（seed 与客户端内置公钥不一致？）' }

          dotnet run --project src/Pathleap.ReleaseTool -- verify --manifest dist/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'latest.json 验签失败，拒绝上传' }

          gh release upload $LpTag dist/latest.json dist/latest.json.sig --clobber
          if ($LASTEXITCODE -ne 0) { throw '上传 latest.json / latest.json.sig 失败' }

          gh release view $LpTag --json name,tagName,isPrerelease,assets

      - name: 说明（非 tag 只做校验）
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: pwsh
        run: |
          Write-Host "非 tag 构建：只做版本解析、脚本变量检查、发布工具自检与编译，不打包、不创建 Release。"
