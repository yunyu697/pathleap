name: build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 解析版本号
        id: lpver
        shell: pwsh
        run: |
          $LpRefType = "${{ github.ref_type }}"
          $LpRefName = "${{ github.ref_name }}"
          if ($LpRefType -eq 'tag') {
            if (-not $LpRefName.StartsWith('v')) {
              throw "tag 必须以 v 开头: $LpRefName"
            }
            $LpVersion = $LpRefName.Substring(1)
          }
          else {
            $LpPropsRaw = Get-Content -LiteralPath ./Directory.Build.props -Raw
            $LpVersion = [regex]::Match($LpPropsRaw, '<PathleapVersion>([^<]+)</PathleapVersion>').Groups[1].Value.Trim()
          }

          if ($LpVersion -notmatch '^[0-9]+[.][0-9]+[.][0-9]+(-alpha[0-9]+)?$') {
            throw "版本号不合法: $LpVersion"
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$LpVersion"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "artifactName=Pathleap-$LpVersion-win-x64"

      - name: 脚本变量命名检查
        shell: pwsh
        run: ./tools/Test-LpVariableNames.ps1

      - name: 编译 Release x64（UI / Service / Shared）
        shell: pwsh
        run: ./tools/Build-Lp.ps1 -LpConfiguration Release -LpSkipVariableCheck -LpVersion '${{ steps.lpver.outputs.version }}'

      - name: 打包便携版 zip
        shell: pwsh
        run: ./tools/Package-Lp.ps1 -LpConfiguration Release

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 生成安装包
        shell: pwsh
        run: ./tools/Package-LpInstaller.ps1 -LpConfiguration Release

      - name: 核对产物
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | Select-Object Name, Length | Format-Table -AutoSize
          $LpZip = Get-ChildItem -Path dist -Filter '*.zip' -File
          $LpSetup = Get-ChildItem -Path dist -Filter '*-setup.exe' -File
          if (-not $LpZip) { throw '缺少便携版 zip' }
          if (-not $LpSetup) { throw '缺少安装包 setup.exe' }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lpver.outputs.artifactName }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: 发布 GitHub Release（tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $LpTag = "${{ github.ref_name }}"
          $LpVersion = $LpTag.Substring(1)
          $LpNotesFile = "docs/$LpVersion-发布说明.md"
          $LpAssets = @(
            Get-ChildItem -Path dist -File |
              Where-Object { $_.Extension -in @('.zip', '.exe') } |
              ForEach-Object { $_.FullName }
          )
          if (-not $LpAssets) { throw '没有可上传的发布产物' }

          if (gh release view $LpTag 2>$null) {
            gh release upload $LpTag @LpAssets --clobber
            if (Test-Path -LiteralPath $LpNotesFile) {
              gh release edit $LpTag --notes-file $LpNotesFile
            }
          }
          elseif (Test-Path -LiteralPath $LpNotesFile) {
            gh release create $LpTag @LpAssets --title "Pathleap $LpTag" --notes-file $LpNotesFile
          }
          else {
            gh release create $LpTag @LpAssets --title "Pathleap $LpTag" --generate-notes
          }
