name: build

# GitHub 上只保留 tag 作为版本标记：不创建 Release、不上传任何产物资产、不发包。
# 安装包与便携 zip 只在本地用 tools/ 脚本生成（见 README §6）。
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 解析版本号（tag 仅作版本标记，校验格式后注入编译）
        id: lpver
        shell: pwsh
        run: |
          $LpRefType = "${{ github.ref_type }}"
          $LpRefName = "${{ github.ref_name }}"
          if ($LpRefType -eq 'tag') {
            if (-not $LpRefName.StartsWith('v')) {
              throw "tag 必须以 v 开头: $LpRefName"
            }
            $LpVersion = $LpRefName.Substring(1)
          }
          else {
            $LpPropsRaw = Get-Content -LiteralPath ./Directory.Build.props -Raw
            $LpVersion = [regex]::Match($LpPropsRaw, '<PathleapVersion>([^<]+)</PathleapVersion>').Groups[1].Value.Trim()
          }

          if ($LpVersion -notmatch '^[0-9]+[.][0-9]+[.][0-9]+(-alpha[0-9]+)?$') {
            throw "版本号不合法: $LpVersion"
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$LpVersion"

      - name: 脚本变量命名检查
        shell: pwsh
        run: ./tools/Test-LpVariableNames.ps1

      - name: 发布工具自检（Ed25519 / 语义化版本 / 清单签名）
        shell: pwsh
        run: dotnet run --project src/Pathleap.ReleaseTool -- selftest

      - name: 编译 Release x64（UI / Service / Shared）
        shell: pwsh
        run: ./tools/Build-Lp.ps1 -LpConfiguration Release -LpSkipVariableCheck -LpVersion '${{ steps.lpver.outputs.version }}'

      - name: 说明（tag 只做版本标记）
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq 'tag') {
            Write-Host "tag ${{ github.ref_name }} 仅作版本标记：本次只做编译校验与发布工具自检。"
            Write-Host "不创建 Release、不上传资产；zip 与安装包请在本地用 tools/Package-Lp.ps1 与 tools/Package-LpInstaller.ps1 生成。"
          }
